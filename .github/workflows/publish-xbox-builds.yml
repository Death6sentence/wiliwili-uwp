name: Publish Xbox build archives
on:
  push:
    branches: [publish-xbox-builds]
    paths: [.github/workflows/publish-xbox-builds.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download and verify Actions archive
        shell: bash
        run: |
          gh api "repos/$GH_REPO/actions/artifacts/14336198851/zip" > wiliwili-uwp-1.6.0.10-x64.zip
          echo "9b4864c47ccba2dd4d2e77789131f2a4001d24256913c9e4d8a6383bc24f7c4e  wiliwili-uwp-1.6.0.10-x64.zip" | sha256sum -c -
      - name: Publish prerelease
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          Xbox UWP 1.6.0.10 测试版，来自成功的 Actions 运行 44099740103。
          包含签名 x64 MSIX、Microsoft.VCLibs x64 依赖和测试证书。
          移植 wiliwili 上游 88e5876 的网络 API 改动，包括 HTTPS、Cookie、二维码登录会话、WBI 首页与搜索请求。
          鼠标增加 WinRT 相对移动事件备选路径。
          编译及打包成功。Xbox 上二维码登录、视频播放和实体鼠标功能需要真机验证。
          NOTES
          gh release create xbox-mouse-network-test-1.6.0.10 \
            wiliwili-uwp-1.6.0.10-x64.zip \
            --target 8f546d40ebc27c20b9a291a3689443ba9b3dc9ca \
            --title "Xbox 鼠标与网络测试版 1.6.0.10" \
            --notes-file release-notes.md --prerelease
